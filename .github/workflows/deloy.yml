name: Deploy Flutter Web to Azure Static Web Apps
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v3

      # Flutter SDKのキャッシュ
      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: |
            ${{ runner.tool_cache }}/flutter
          key: flutter-${{ hashFiles('**/pubspec.lock') }}-${{ runner.os }}
          restore-keys: |
            flutter-${{ hashFiles('**/pubspec.lock') }}-
            flutter-

      # Flutter環境のセットアップ
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true  # キャッシュを有効化
          cache-key: flutter-cache  # キャッシュキー（任意）

      # 依存関係のキャッシュ
      - name: Cache Pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-cache-

      # 依存関係の取得
      - run: flutter pub get

      # Flutter Webアプリのビルド
      - run: flutter build web --release

      # Azure Static Web Appsにデプロイ
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "build/web"